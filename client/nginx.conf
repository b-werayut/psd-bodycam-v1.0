# nginx template (copied to /etc/nginx/templates/default.conf.template).
# At container start the nginx image runs envsubst on it: only ${BACKEND_URL} is replaced,
# nginx variables such as $host are left alone because they are not environment variables.
#
# Same topology as the running psd-bwc system (Part 2 s2.3): the ingress sends every path to
# this container, and this container proxies /api/, /api/talk/ws and /socket.io/ to the API.
# BACKEND_URL = scheme://host:port of the API service, with no path and no trailing slash
# (e.g. http://<api-service>.<namespace>.svc:3000) so the original URI is passed through as is.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Keep the scheme the ingress saw (TLS ends there); fall back to ours when called directly.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches the API body limit (server BODY_LIMIT = 1mb). Raise both together when uploads arrive.
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # REST, webhooks and the HLS proxy. Long timeouts: stream start can take ~45s and
  # evidence downloads are large.
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Raw WebSocket for two-way talk (not Socket.IO): /api/ above does not forward Upgrade.
  location /api/talk/ws {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  location /socket.io/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Hashed build assets: cache for a year; a missing asset must 404, never fall back to index.html.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
