name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Same images as docker-compose.dev.yml. The official postgres image ships btree_gist (contrib).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bwc
          POSTGRES_USER: bwc
          POSTGRES_PASSWORD: bwc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U bwc -d bwc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # CI-only throwaway credentials for the service containers above.
      DATABASE_URL: postgres://bwc:bwc@localhost:5432/bwc
      DATABASE_URL_TEST: postgres://bwc:bwc@localhost:5432/bwc_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Creates bwc_test and applies drizzle migrations (integration tests seed their own rows).
      - run: npm run db:prepare:test
      - run: npm run test:int
